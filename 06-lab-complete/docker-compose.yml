# ============================================================
# Chạy agent + Redis bằng một lệnh:  docker compose up --build
# Cần file .env (cp .env.example .env và đặt AGENT_API_KEY). Thiếu .env vẫn chạy được,
# nhưng khi đó AGENT_API_KEY trống và mọi /ask đều trả 401.
# ============================================================
services:
  agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      # Ghi đè REDIS_URL trong .env: trong mạng compose, Redis là service "redis"
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
