# Deploy Render (Blueprint): một web service từ Dockerfile + một Redis.
# Thay cho railway.toml — chỉ cần một trong hai file.
# AGENT_API_KEY dùng generateValue: Render tự sinh, KHÔNG ghi giá trị vào file này.

services:
  - type: web
    name: ai-agent
    runtime: docker
    plan: free   # bắt buộc ghi rõ, nếu không Render mặc định gói trả phí và đòi thẻ
    # Repo chứa agent ở thư mục 06-lab-complete/ (không phải gốc repo)
    dockerfilePath: ./06-lab-complete/Dockerfile
    dockerContext: ./06-lab-complete
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: AGENT_API_KEY
        generateValue: true
      - key: REDIS_URL
        fromService:
          type: redis
          name: agent-redis
          property: connectionString
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
      - key: DAILY_BUDGET_USD
        value: "1.0"

  - type: redis
    name: agent-redis
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []
