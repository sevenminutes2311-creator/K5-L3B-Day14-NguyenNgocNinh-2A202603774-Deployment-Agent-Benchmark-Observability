# Deploy Railway: build từ Dockerfile, health check /health.
# Secret (AGENT_API_KEY, REDIS_URL...) đặt bằng Railway variables, KHÔNG ghi vào file này:
#   railway variables set AGENT_API_KEY=<key>   (và REDIS_URL trỏ tới Redis trên Railway)

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 60
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
